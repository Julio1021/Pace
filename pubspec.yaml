name: pace
description: PACE — monitoramento e evolução de corrida de rua.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  provider: ^6.1.5
  sqflite: ^2.4.2
  path: ^1.9.0
  path_provider: ^2.1.5
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  flutter_tts: ^4.2.3
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  fl_chart: ^1.1.0
  file_picker: ^13.3.2
  share_plus: ^13.3.1
  xml: ^6.5.0
  archive: ^4.0.7
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
