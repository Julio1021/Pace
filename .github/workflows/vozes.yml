name: Gravar falas
on:
  push:
    paths: ['tool/vozes/**', '.github/workflows/vozes.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vozes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install edge-tts
      - run: python tool/vozes/gerar.py out && ls out | wc -l && du -sh out
      - name: Publicar pacote de falas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out && zip -q -r ../voz-francisca.zip . && cd ..
          gh release view vozes >/dev/null 2>&1 || gh release create vozes --title "Amostras de voz" --notes "Vozes do PACE" --prerelease
          gh release upload vozes voz-francisca.zip --clobber
