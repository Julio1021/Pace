name: Amostras de voz
on:
  push:
    paths: ['tool/vozes/**', '.github/workflows/vozes.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vozes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install edge-tts
      - run: mkdir out && python tool/vozes/amostras.py out && find out -size 0 -delete && ls -la out
      - name: Publicar amostras
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete vozes -y --cleanup-tag || true
          gh release create vozes out/*.mp3 --title "Amostras de voz" --notes "Amostras de vozes femininas para as falas do PACE" --prerelease
